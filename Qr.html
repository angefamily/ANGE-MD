<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>👼 ANGE-MD — Connexion par QR code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #c9a44c;
        --gold-light: #e8cf8a;
        --sky: #eaf4fb;
        --ivory: #fdfbf5;
        --ink: #4a4536;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', serif;
        background: radial-gradient(ellipse at top, var(--sky) 0%, var(--ivory) 55%, #fff 100%);
        color: var(--ink);
        padding: 24px;
    }
    .card {
        width: 100%;
        max-width: 420px;
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(201,164,76,0.4);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(201,164,76,0.15), 0 0 0 1px rgba(255,255,255,0.6) inset;
    }
    .halo {
        font-size: 42px;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 12px rgba(201,164,76,0.6));
    }
    h1 {
        font-family: 'Cinzel', serif;
        font-size: 26px;
        letter-spacing: 2px;
        margin: 0 0 4px;
        background: linear-gradient(180deg, #f3dfa0, var(--gold));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    p.sub { margin: 0 0 28px; font-size: 17px; opacity: .75; }
    .qr-frame {
        width: 260px;
        height: 260px;
        margin: 0 auto;
        border-radius: 20px;
        background: #fff;
        border: 1px solid rgba(201,164,76,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(201,164,76,0.25);
        overflow: hidden;
    }
    .qr-frame img { width: 100%; height: 100%; }
    .qr-frame .loading { font-size: 15px; opacity: .6; }
    .hint { font-size: 14px; opacity: .6; margin-top: 18px; }
    .status { margin-top: 12px; font-size: 15px; opacity: .8; }
    .status.connected { color: #4a7c4a; font-weight: 600; }
    a.back { display: inline-block; margin-top: 24px; color: var(--gold); text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
    <div class="card">
        <div class="halo">👼</div>
        <h1>ANGE-MD</h1>
        <p class="sub">Connexion par QR code</p>

        <div class="qr-frame" id="qrFrame">
            <span class="loading">✨ Génération du QR...</span>
        </div>

        <div class="hint">WhatsApp → Appareils liés → Lier un appareil, puis scanne ce code.</div>
        <div class="status" id="status"></div>

        <a class="back" href="/">← Retour au royaume</a>
    </div>

<script>
    const qrFrame = document.getElementById('qrFrame');
    const statusEl = document.getElementById('status');

    async function refresh() {
        try {
            const res = await fetch('/api/qr');
            const data = await res.json();

            if (data.status === 'connected') {
                qrFrame.innerHTML = '<span class="loading">🟢</span>';
                statusEl.textContent = '🟢 Connecté ! ANGE-MD veille désormais sur ta connexion.';
                statusEl.classList.add('connected');
                return;
            }

            if (data.qrDataUrl) {
                qrFrame.innerHTML = `<img src="${data.qrDataUrl}" alt="QR code ANGE-MD" />`;
            } else {
                qrFrame.innerHTML = '<span class="loading">✨ En attente du QR...</span>';
            }
        } catch (e) {
            qrFrame.innerHTML = '<span class="loading">❌ Serveur injoignable</span>';
        }
        setTimeout(refresh, 4000);
    }

    refresh();
</script>
</body>
</html>
