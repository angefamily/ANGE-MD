services:
  - type: web
    name: ange-md
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: ange-md-session
      mountPath: /app/session
      sizeGB: 1
    envVars:
      - key: OWNER_NUMBER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: PORT
        value: 3000
